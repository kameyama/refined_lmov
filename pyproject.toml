[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcsknots"
version = "0.1.0"
description = "Refined Chern–Simons invariants and refined BPS invariants of iterated torus knots"
requires-python = ">=3.11"
dependencies = [
    "sympy",
    "numpy",
    "mpmath",
    "python-flint",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定は機能テストだけ。保存済みの大きな計算結果の再検証は results の印を付け、内容や理論に問題が出たときだけ -m results で実行する
addopts = "-m 'not results'"
markers = ["results: 保存済みの大きな計算結果の再検証（既定では実行しない）"]
